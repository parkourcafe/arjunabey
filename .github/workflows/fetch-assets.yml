# Temporary utility workflow: fetches generated editorial imagery (the media
# CDN is unreachable from the dev container's network) and commits it.
# Safe to delete once the assets are in place.
name: Fetch editorial imagery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and place imagery
        run: |
          set -euo pipefail
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3EKntK4EDjG8nay4H1dy1TK30mB
          mkdir -p src/assets/placeholders
          dl () { curl -fsSL -o "/tmp/$1.png" "$B/$2"; }

          dl place        hf_20260728_164406_5ad5ec7f-bf90-4540-94cf-7e1ddccb2f5b.png
          dl surf         hf_20260728_164522_201e3702-2273-4906-96b2-ed21574015bd.png
          dl wellness     hf_20260728_164535_5a4feb91-7bd1-437e-a98c-68a8d1a130be.png
          dl dining       hf_20260728_164600_8cf0a462-3f26-47e6-8d54-6f799394ce41.png
          dl celebrations hf_20260728_164615_ec97160e-c95e-49c0-940b-32c2c152e4a8.png
          dl around       hf_20260728_164620_a39213e7-0cdd-4e8a-ad0a-be03461946d9.png
          dl about        hf_20260728_164632_f85f28db-7cfd-4831-b4fe-89c069ece533.png
          dl journal      hf_20260728_164652_f65670ae-65c8-47fb-9adb-e64c283dad0d.png

          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          P=src/assets/placeholders
          conv () { convert "/tmp/$1.png" -quality 88 "$P/$2"; }

          conv place        the-place-hero.jpg
          conv surf         experience-surf.jpg
          conv wellness     experience-wellness.jpg
          conv dining       experience-dining.jpg
          conv celebrations experience-celebrations.jpg
          conv around       experience-around.jpg
          conv about        about-hero.jpg
          conv journal      journal-generic.jpg
          cp "$P/the-place-hero.jpg" "$P/villa-card-generic.jpg"

          # These are now real photographs, not synthetic gradients — drop the
          # stale pristine copies so the grading script re-seeds from them.
          rm -rf "$P/.originals"
          ls -la "$P"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/placeholders
          git commit -m "Replace synthetic placeholder gradients with real editorial imagery"
          git push origin main
