# Temporary utility workflow: fetches generated imagery (the media CDN is
# unreachable from the dev container's network) and commits it.
# Safe to delete once the assets are in place.
name: Fetch page imagery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and place
        run: |
          set -euo pipefail
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3EKntK4EDjG8nay4H1dy1TK30mB
          curl -fsSL -o /tmp/book.png  "$B/hf_20260728_182027_dbc6d1b8-1aef-4328-aa25-c6edd66e05ac.png"
          curl -fsSL -o /tmp/legal.png "$B/hf_20260728_182030_b4401f40-a28a-44da-86a9-b34c24a04a76.png"
          curl -fsSL -o /tmp/404.png   "$B/hf_20260728_182042_1428e7bb-400a-4c78-a0c6-9392d399dcf9.png"

          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          P=src/assets/placeholders
          convert /tmp/book.png  -quality 88 "$P/book-hero.jpg"
          convert /tmp/legal.png -quality 88 "$P/legal-hero.jpg"
          convert /tmp/404.png   -quality 88 "$P/notfound-hero.jpg"
          ls -la "$P"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/placeholders
          git commit -m "Add imagery for the reserve, legal and 404 pages"
          git push origin main
